services:
  # ── Flask API ────────────────────────────────────────────────────────────
  # Docker (not a native Python env) because the analysis pipeline shells out
  # to `git`, which the native runtime does not guarantee.
  - type: web
    name: github-analyzer-api
    runtime: docker
    plan: starter          # free tier has no disk for clones and sleeps mid-analysis
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true      # Render generates a strong value; never commit one
      - key: CORS_ORIGINS
        sync: false              # set to the deployed frontend URL
      - key: FRONTEND_URL
        sync: false              # OAuth redirect target after login
      - key: BACKEND_URL
        sync: false              # must match the OAuth callback URL exactly
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITLAB_CLIENT_ID
        sync: false
      - key: GITLAB_CLIENT_SECRET
        sync: false
      - key: BITBUCKET_CLIENT_ID
        sync: false
      - key: BITBUCKET_CLIENT_SECRET
        sync: false

  # ── React SPA ────────────────────────────────────────────────────────────
  - type: web
    name: github-analyzer-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    rootDir: ./frontend
    autoDeploy: false
    envVars:
      - key: VITE_API_URL
        sync: false              # the API service's URL, baked in at build time
    routes:
      # React Router owns /dashboard; without this a refresh there 404s.
      - type: rewrite
        source: /*
        destination: /index.html
