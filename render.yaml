services:
  # ── Flask API ────────────────────────────────────────────────────────────
  # Docker (not a native Python env) because the analysis pipeline shells out
  # to `git`, which the native runtime does not guarantee.
  - type: web
    name: github-analyzer-api
    runtime: docker
    # Free tier: 512 MB RAM and a sleep after ~15 min idle. Clones land in the
    # container's ephemeral filesystem and are deleted after each analysis, so
    # no persistent disk is needed — but see the memory ceiling caveat in
    # DEPLOY.md before analysing large repositories.
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: FLASK_ENV
        value: production
      - key: GA_BLAME_WORKERS     # parallel `git blame`; 2 keeps the free
        value: "2"                # tier well under its 512 MB ceiling
      - key: FLASK_SECRET_KEY
        generateValue: true      # Render generates a strong value; never commit one
      - key: CORS_ORIGINS
        sync: false              # set to the deployed frontend URL
      - key: FRONTEND_URL
        sync: false              # OAuth redirect target after login
      - key: BACKEND_URL
        sync: false              # must match the OAuth callback URL exactly
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITLAB_CLIENT_ID
        sync: false
      - key: GITLAB_CLIENT_SECRET
        sync: false
      - key: BITBUCKET_CLIENT_ID
        sync: false
      - key: BITBUCKET_CLIENT_SECRET
        sync: false

  # ── React SPA ────────────────────────────────────────────────────────────
  - type: web
    name: github-analyzer-web
    runtime: static
    rootDir: ./frontend
    # Paths below are relative to rootDir, so this is frontend/dist on disk.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: VITE_API_URL
        sync: false              # the API service's URL, baked in at build time
    routes:
      # React Router owns /dashboard; without this a refresh there 404s.
      - type: rewrite
        source: /*
        destination: /index.html
